<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learn with Asher</title>
<style>
:root{--bg:#fff7e0;--card:#fff;--ink:#3a2e5c;--a:#ff6b6b;--b:#4dabf7;--c:#51cf66;--d:#ffa94d;--sh:rgba(58,46,92,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1b34;--card:#2f2a4d;--ink:#fff4d6;--sh:rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#1f1b34;--card:#2f2a4d;--ink:#fff4d6;--sh:rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Baloo 2","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;user-select:none}
#app{width:100%;max-width:520px;flex:1;display:flex;flex-direction:column;padding:12px 16px 16px;gap:12px;overflow-y:auto}
header{display:flex;justify-content:space-between;align-items:center;min-height:48px}
h1{font-size:26px;margin:0}
.pill{background:var(--card);border-radius:30px;padding:6px 14px;font-size:20px;box-shadow:0 3px 0 var(--sh)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.big{width:100%;border-radius:28px;padding:22px;font-size:34px;font-weight:700;color:#fff;box-shadow:0 7px 0 var(--sh);display:flex;align-items:center;gap:16px}
.big:active,.tile:active,.nav:active{transform:translateY(4px);box-shadow:none}
.big span{font-size:56px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid .big{flex-direction:column;font-size:26px;padding:16px 6px;gap:0;justify-content:center}
.grid .big span{font-size:54px}
.tile{background:var(--card);border-radius:32px;box-shadow:0 7px 0 var(--sh);text-align:center;padding:18px 10px;width:100%}
.letter{font-size:150px;line-height:1;font-weight:800}
.pic{font-size:110px;line-height:1.1}
.word{font-size:30px;font-weight:700}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.nav{background:var(--card);border-radius:50%;width:68px;height:68px;font-size:30px;box-shadow:0 5px 0 var(--sh);flex:none}
.back{background:var(--card);border-radius:30px;padding:8px 16px;font-size:22px;box-shadow:0 3px 0 var(--sh)}
.strip{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.strip button{width:40px;height:40px;border-radius:12px;background:var(--card);font-size:20px;font-weight:700;box-shadow:0 3px 0 var(--sh)}
.strip button.on{background:var(--d);color:#fff}
.strip.lang button{width:56px;height:50px;font-size:28px}
.strip.wide button{width:auto;padding:0 18px}
.items{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:130px;align-content:center}
.items button{background:none;font-size:44px;padding:2px;transition:transform .2s}
.items button.hit{transform:scale(1.35) rotate(-8deg);filter:drop-shadow(0 0 8px gold)}
.numeral{font-size:120px;font-weight:800;line-height:1}
.hint{font-size:18px;opacity:.75;text-align:center;margin:0}
.q{font-size:28px;font-weight:700;text-align:center}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.choices .tile{font-size:64px;font-weight:800;padding:20px 6px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sg .tile{padding:10px 2px;font-size:18px;font-weight:700;border-radius:24px}
.dot{width:60px;height:60px;border-radius:50%;margin:0 auto 2px}
.gl{font-size:60px;line-height:1.1}
canvas{width:100%;background:var(--card);border-radius:28px;box-shadow:0 7px 0 var(--sh);touch-action:none}
.stat{font-size:22px;line-height:1.7;text-align:left}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;z-index:10;font-size:18px}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.15)}}
.star{position:fixed;font-size:34px;pointer-events:none;animation:fly 1.2s ease-out forwards;z-index:9}
@keyframes fly{to{transform:translateY(-160px) rotate(360deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"></div>
<script>
const L=[["A","Apple","🍎"],["B","Ball","⚽"],["C","Cat","🐱"],["D","Dog","🐶"],["E","Elephant","🐘"],["F","Fish","🐟"],["G","Grapes","🍇"],["H","Hat","🎩"],["I","Ice cream","🍦"],["J","Juice","🧃"],["K","Kite","🪁"],["L","Lion","🦁"],["M","Moon","🌙"],["N","Nest","🪺"],["O","Orange","🍊"],["P","Pig","🐷"],["Q","Queen","👑"],["R","Rainbow","🌈"],["S","Sun","☀️"],["T","Tree","🌳"],["U","Umbrella","☂️"],["V","Van","🚐"],["W","Whale","🐳"],["X","Xylophone","🎹"],["Y","Yo-yo","🪀"],["Z","Zebra","🦓"]];
const LG={
en:{f:"🇬🇧",v:"en-GB",num:"one two three four five six seven eight nine ten".split(" "),col:"red blue green yellow orange purple".split(" "),shp:"circle square triangle star heart diamond".split(" "),g:"Great job!",a:"Try again",fl:"Find the letter",fn:"Find the number",h:"Let's learn!"},
es:{f:"🇪🇸",v:"es-ES",num:"uno dos tres cuatro cinco seis siete ocho nueve diez".split(" "),col:"rojo azul verde amarillo naranja morado".split(" "),shp:"círculo cuadrado triángulo estrella corazón rombo".split(" "),g:"¡Muy bien!",a:"Inténtalo otra vez",fl:"Encuentra la letra",fn:"Encuentra el número",h:"¡A aprender!"},
fr:{f:"🇫🇷",v:"fr-FR",num:"un deux trois quatre cinq six sept huit neuf dix".split(" "),col:"rouge bleu vert jaune orange violet".split(" "),shp:"cercle carré triangle étoile cœur losange".split(" "),g:"Bravo !",a:"Réessaie",fl:"Trouve la lettre",fn:"Trouve le chiffre",h:"Apprenons !"},
de:{f:"🇩🇪",v:"de-DE",num:"eins zwei drei vier fünf sechs sieben acht neun zehn".split(" "),col:"rot blau grün gelb orange lila".split(" "),shp:"Kreis Quadrat Dreieck Stern Herz Raute".split(" "),g:"Super!",a:"Versuch es nochmal",fl:"Finde den Buchstaben",fn:"Finde die Zahl",h:"Los geht's!"}};
const E=["⭐","🐥","🎈","🍓","🐟","🦋","🌼","🐞","🍪","🚗"];
const COL=["#ff6b6b","#4dabf7","#51cf66","#ffa94d","#cc5de8","#20c997"];
const HEX=["#e03131","#1c7ed6","#2f9e44","#fcc419","#fd7e14","#9c36b6"];
const SH=["●","■","▲","★","♥","◆"];
const S={stars:0,lg:"en",l:{},n:{},s:{},qa:0,qc:0,tr:0};
try{Object.assign(S,JSON.parse(localStorage.getItem("ll")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("ll",JSON.stringify(S))}catch(e){}};
let lg=LG[S.lg]?S.lg:"en",screen="home",li=0,ni=0,ti=0,tm="L",count=0,ans=null,ac,voices=[],gate=false,gq={},drawing=false,last;
const T=()=>LG[lg];
const $=document.getElementById("app");
const loadV=()=>{try{voices=speechSynthesis.getVoices()}catch(e){}};loadV();try{speechSynthesis.onvoiceschanged=loadV}catch(e){}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2500)}
function say(t){try{const code=T().v,pre=code.slice(0,2),n=x=>x.lang.replace("_","-").toLowerCase();
const vo=voices.find(x=>n(x)===code.toLowerCase())||voices.find(x=>n(x).startsWith(pre));
if(voices.length&&!vo&&pre!=="en"){toast("🔇 No voice for this language on this device");return}
speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.8;u.pitch=1.3;u.lang=code;if(vo)u.voice=vo;speechSynthesis.speak(u)}catch(e){}}
function tone(f,d=.15,t=0){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type="triangle";o.frequency.value=f;o.connect(g);g.connect(ac.destination);const s=ac.currentTime+t;g.gain.setValueAtTime(.2,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)}catch(e){}}
const ding=()=>[523,659,784].forEach((f,i)=>tone(f,.2,i*.12));
const boop=()=>tone(200,.25);
function burst(){for(let i=0;i<10;i++){const s=document.createElement("div");s.className="star";s.textContent=["⭐","✨","🎉"][i%3];s.style.left=(10+Math.random()*80)+"vw";s.style.top=(40+Math.random()*30)+"vh";document.body.appendChild(s);setTimeout(()=>s.remove(),1300)}}
const hdr=t=>`<header><button class="back" onclick="go('home')">🏠</button><h1>${t}</h1><div class="pill">⭐ ${S.stars}</div></header>`;
function go(s){screen=s;gate=false;if(s==="play")newQ();if(s==="parent")gq={a:3+Math.random()*6|0,b:3+Math.random()*6|0};if(s==="trace"){ti=0}render();if(s==="home")say(T().h);if(s==="abc")sayL();if(s==="num")sayN()}
function setLg(k){lg=k;S.lg=k;save();render();say(T().h)}
function render(){
if(screen==="home"){$.innerHTML=`<header><h1>Learn with Asher</h1><button class="pill" onclick="go('parent')">👨‍👩‍👧</button></header>
<div class="strip lang">${Object.keys(LG).map(k=>`<button class="${k===lg?'on':''}" onclick="setLg('${k}')">${LG[k].f}</button>`).join("")}</div>
<div class="grid"><button class="big" style="background:var(--a)" onclick="go('abc')"><span>🔤</span>ABC</button>
<button class="big" style="background:var(--b)" onclick="go('num')"><span>🔢</span>123</button>
<button class="big" style="background:#cc5de8" onclick="go('shapes')"><span>🎨</span>●■▲</button>
<button class="big" style="background:var(--d)" onclick="go('trace')"><span>✏️</span>Aa</button>
<button class="big" style="background:var(--c);grid-column:span 2" onclick="go('play')"><span>🎮</span>Play</button></div>`}
else if(screen==="abc"){const[l,w,p]=L[li];$.innerHTML=hdr("ABC")+`<button class="tile pop" onclick="sayL()" style="color:${COL[li%6]}"><div class="letter">${l}${l.toLowerCase()}</div><div class="pic">${p}</div>${lg==="en"?`<div class="word">${l} is for ${w}</div>`:""}</button>
<div class="row"><button class="nav" onclick="stepL(-1)">⬅️</button><button class="nav" onclick="sayL()">🔊</button><button class="nav" onclick="stepL(1)">➡️</button></div>
<div class="strip">${L.map((x,i)=>`<button class="${i===li?'on':''}" onclick="li=${i};render();sayL()">${x[0]}</button>`).join("")}</div>`}
else if(screen==="num"){count=0;$.innerHTML=hdr("123")+`<div class="tile pop"><div class="numeral" style="color:${COL[ni%6]}" onclick="sayN()">${ni+1}</div><div class="word">${T().num[ni]}</div></div>
<div class="items">${Array.from({length:ni+1},()=>`<button onclick="cnt(this)">${E[ni]}</button>`).join("")}</div>
<p class="hint">👆 1, 2, 3 …</p>
<div class="row"><button class="nav" onclick="stepN(-1)">⬅️</button><button class="nav" onclick="sayN()">🔊</button><button class="nav" onclick="stepN(1)">➡️</button></div>`}
else if(screen==="shapes"){$.innerHTML=hdr("🎨")+`<div class="sg">${HEX.map((h,i)=>`<button class="tile" onclick="sayX('c',${i},T().col[${i}])"><div class="dot" style="background:${h}"></div>${T().col[i]}</button>`).join("")}</div>
<div class="sg">${SH.map((g,i)=>`<button class="tile" onclick="sayX('s',${i},T().shp[${i}])" style="color:${COL[i]}"><div class="gl">${g}</div>${T().shp[i]}</button>`).join("")}</div>`}
else if(screen==="trace"){$.innerHTML=hdr("✏️")+`<div class="strip wide"><button class="${tm==='L'?'on':''}" onclick="tmode('L')">Aa</button><button class="${tm==='N'?'on':''}" onclick="tmode('N')">123</button></div>
<canvas id="cv" width="460" height="320"></canvas>
<div class="row"><button class="nav" onclick="stepT(-1)">⬅️</button><button class="nav" onclick="guide()">🧹</button><button class="nav" onclick="doneT()">✅</button><button class="nav" onclick="stepT(1)">➡️</button></div>`;setupCv()}
else if(screen==="play"){$.innerHTML=hdr("🎮")+`<div class="q" onclick="askQ()">🔊 ${ans.text}</div><div class="choices">${ans.opts.map(o=>`<button class="tile" style="color:${COL[(o.length+o.charCodeAt(0))%6]}" onclick="pick(this,'${o}')">${o}</button>`).join("")}</div>`}
else if(screen==="parent"){$.innerHTML=hdr("👨‍👩‍👧")+(gate?`<div class="tile stat">⭐ Stars: <b>${S.stars}</b><br>🔤 Letters visited: <b>${Object.keys(S.l).length}/26</b><br>🔢 Numbers counted: <b>${Object.keys(S.n).length}/10</b><br>🎨 Colours &amp; shapes: <b>${Object.keys(S.s).length}/12</b><br>✏️ Tracings done: <b>${S.tr}</b><br>🎮 Quiz: <b>${S.qc}/${S.qa}</b> correct</div>
<p class="hint">Voices use your device's built-in speech.</p>
<button class="back" onclick="if(confirm('Reset all progress?')){Object.assign(S,{stars:0,l:{},n:{},s:{},qa:0,qc:0,tr:0});save();render()}">Reset progress</button>`:
`<div class="tile"><div class="q">Grown-ups only:<br>${gq.a} + ${gq.b} = ?</div><p><input id="gi" type="number" inputmode="numeric" style="font:inherit;font-size:30px;width:110px;text-align:center;border-radius:14px;border:2px solid var(--ink);background:var(--bg);color:var(--ink)"> <button class="back" onclick="chk()">OK</button></p></div>`)}}
function chk(){if(+document.getElementById("gi").value===gq.a+gq.b){gate=true;render()}else toast("❌")}
function sayL(){const[l,w]=L[li];S.l[li]=1;save();say(lg==="en"?`${l} is for ${w}`:l);tone(440+li*10,.1)}
function stepL(d){li=(li+d+26)%26;render();sayL()}
function sayN(){say(`${ni+1}. ${T().num[ni]}`);tone(400+ni*40,.12)}
function stepN(d){ni=(ni+d+10)%10;render();sayN()}
function cnt(b){if(b.classList.contains("hit"))return;count++;b.classList.add("hit");say(String(count));tone(400+count*50,.12);if(count===ni+1){setTimeout(()=>{ding();burst();say(`${T().num[ni]}! ${T().g}`);S.stars++;S.n[ni]=1;save()},500)}}
function sayX(k,i,t){S.s[k+i]=1;save();say(t);tone(500+i*60,.12)}
const tg=()=>tm==="L"?L[ti][0]:String(ti+1);
function guide(){const c=document.getElementById("cv"),x=c.getContext("2d"),g=tg();x.clearRect(0,0,c.width,c.height);x.font=`800 ${g.length>1?200:270}px "Baloo 2","Comic Sans MS",system-ui,sans-serif`;x.textAlign="center";x.textBaseline="middle";x.fillStyle="rgba(128,128,128,.18)";x.fillText(g,230,170);x.setLineDash([14,12]);x.lineWidth=4;x.strokeStyle="rgba(128,128,128,.7)";x.strokeText(g,230,170);x.setLineDash([])}
function setupCv(){const c=document.getElementById("cv"),x=c.getContext("2d");guide();
const p=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
c.onpointerdown=e=>{drawing=true;last=p(e);c.setPointerCapture(e.pointerId)};
c.onpointermove=e=>{if(!drawing)return;const q=p(e);x.strokeStyle=COL[ti%6];x.lineWidth=18;x.lineCap="round";x.beginPath();x.moveTo(...last);x.lineTo(...q);x.stroke();last=q};
c.onpointerup=c.onpointercancel=()=>{drawing=false}}
function tmode(m){tm=m;ti=0;render();sayT()}
function stepT(d){const n=tm==="L"?26:10;ti=(ti+d+n)%n;render();sayT()}
function sayT(){say(tm==="L"?tg():T().num[ti])}
function doneT(){ding();burst();say(T().g);S.stars++;S.tr++;save();document.querySelector(".pill").textContent="⭐ "+S.stars}
function newQ(){const isL=Math.random()<.5;let t,pool;if(isL){pool=L.map(x=>x[0]);t=pool[Math.random()*26|0]}else{pool=T().num.map((_,i)=>String(i+1));t=pool[Math.random()*10|0]}
const opts=[t];while(opts.length<4){const o=pool[Math.random()*pool.length|0];if(!opts.includes(o))opts.push(o)}
opts.sort(()=>Math.random()-.5);const pre=isL?T().fl:T().fn;ans={t,opts,text:`${pre} ${t}`,spoken:isL?`${pre} ${t}`:`${pre} ${T().num[t-1]}`};setTimeout(askQ,300)}
function askQ(){say(ans.spoken)}
function pick(b,o){S.qa++;if(o===ans.t){S.qc++;S.stars++;save();ding();burst();say(T().g);b.classList.add("pop");setTimeout(()=>{newQ();render()},1400)}else{save();boop();b.classList.add("shake");say(T().a);setTimeout(()=>b.classList.remove("shake"),500)}}
render();
</script></body></html>
